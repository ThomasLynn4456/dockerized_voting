spring.datasource.url=jdbc:h2:mem:voting_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

telegram.bot-token=
telegram.api-url=https://api.telegram.org
telegram.otp-message-template=Your voting verification code is: %s. This code expires in 5 minutes.
