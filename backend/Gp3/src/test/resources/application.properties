spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voting_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

telegram.bot-token=
telegram.api-url=https://api.telegram.org
telegram.otp-message-template=Your voting verification code is: %s. This code expires in 5 minutes.
