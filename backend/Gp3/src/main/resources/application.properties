spring.application.name=Gp3
spring.config.import=optional:file:.env[.properties],optional:file:backend/Gp3/.env[.properties]
spring.docker.compose.enabled=false
server.port=8080
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}

spring.datasource.url=${DB_URL:jdbc:h2:mem:voting_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.h2.Driver}

app.candidate-images.directory=${CANDIDATE_IMAGES_DIRECTORY:../../candidates_images}
spring.web.resources.static-locations=classpath:/static/

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org}
telegram.otp-message-template=Your voting verification code is: %s. This code expires in 5 minutes.

app.default-admin.name=${DEFAULT_ADMIN_NAME:}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:3000}
