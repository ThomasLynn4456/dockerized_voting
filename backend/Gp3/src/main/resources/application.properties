spring.application.name=Gp3
spring.config.import=optional:file:.env[.properties],optional:file:backend/Gp3/.env[.properties]
server.port=8080
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:Lax}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

app.candidate-images.directory=${CANDIDATE_IMAGES_DIRECTORY:../../candidates_images}
app.voting-page-url=${VOTING_PAGE_URL:http://localhost:3000/welcome}
spring.web.resources.static-locations=classpath:/static/

# Support unrestricted image payload sizes
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.api-url=${TELEGRAM_API_URL:https://api.telegram.org}
telegram.otp-message-template=Your voting verification code is: %s. This code expires in 5 minutes.

app.default-admin.name=${DEFAULT_ADMIN_NAME:}
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.cors.allowed-origin-patterns=${APP_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://192.168.*:3000,http://10.*:3000,http://172.*:3000}
